# Example CI wiring. Copy to .github/workflows/help-articles.yml and adjust the paths.
#
# Two jobs, on purpose:
#   gate    runs on every push and PR. Fails the build when a shipped feature has no article.
#           Needs no secrets.
#   parity  runs daily. Read-only: reports drift between your repo and the live Help Center.
#           Publishing stays a deliberate, human-triggered step (workflow_dispatch below).

name: Help articles

on:
  push:
  pull_request:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish articles marked state: published to Intercom"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the stale-article check reads git history
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node .claude/skills/intercom-article-writer/scripts/coverage-check.mjs --manifest help-articles/coverage-manifest.mjs

  parity:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parity report (read-only)
        env:
          INTERCOM_API_TOKEN: ${{ secrets.INTERCOM_API_TOKEN }} # only this secret, nothing else
        run: node .claude/skills/intercom-article-writer/scripts/publish.mjs --parity
      - name: Publish (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          INTERCOM_API_TOKEN: ${{ secrets.INTERCOM_API_TOKEN }}
          INTERCOM_AUTHOR_ID: ${{ vars.INTERCOM_AUTHOR_ID }}
        # Note: this updates frontmatter (intercom_id, last_synced) and PUBLISHED.md on the runner.
        # Commit those back in a follow-up step, or run --publish locally instead so the ids land in git.
        run: node .claude/skills/intercom-article-writer/scripts/publish.mjs --publish
