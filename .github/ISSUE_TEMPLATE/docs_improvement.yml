name: Docs improvement
description: Something in the README, docs/ or the skill references is wrong, unclear or missing.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Where
      description: The file and section, or a link to it.
      placeholder: "docs/SETUP.md, section 'Install'"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem
      options:
        - It is wrong (does not match what the plugin does)
        - It is unclear
        - Something is missing
        - A link or command is broken
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
      description: Optional. If you have a fix in mind, paste it here, or open a pull request against `dev`.
